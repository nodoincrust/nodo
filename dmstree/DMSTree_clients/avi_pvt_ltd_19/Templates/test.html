<html lang="en-US"><head><meta charset="UTF-8"><title>Template Form</title><link  rel="stylesheet" href="bootstrap/css/bootstrap.min.css" media="screen"><script type="text/javascript" src="js/dmstree_js/doc_temp_valid.js"></script><script>$( document ).ready(function(){ $(".datepicker").datepicker({dateFormat: "dd-mm-yy"}); $("#doc_template .droppedField").each(function(){ if(($(this).find(".table_div").length) != 0) { var btnstatus = $(this).find(".addstatus").val(); btnstatus = btnstatus.trim();if(btnstatus == "cols" && btnstatus != ""){ $(this).find(".tbl_btn").css("display","block"); } else{$(this).find(".tbl_btn").css("display","none");}} })});</script></head><body><style>

        /* Styles that are also copied for Preview */
        .control-label {
            display: inline-block !important;
            padding-top: 5px;
            text-align: left;
            vertical-align: baseline;
            padding-right: 10px;
        }
        .droppedField {
            padding-left:5px;
        }
        .droppedField > input,.checkboxgroup, .selectmultiple, .radiogroup { /*button, select, */ 
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .action-bar .droppedField {
            float: left;
            padding-left:5px;
        }
        .btn:hover {
            color: #333;
            text-decoration: none;
            background-position: 0 -15px;
        }
        .framebox {
            border: 1px solid rgb(231, 231, 231);
        }
        .row {
            margin-left: 0 !important;
        }
        .droppedField {
            margin: 0 0 15px;
        }
        .form_btn .btn {
            float: right;
            margin-right: 10px;
        }
        .boldfont {
            font-weight: bold;
        }
        .italicfont {
            font-weight: normal;
            font-style: italic; 
        }
        .inline_radio {
            display: inline-block !important;
            margin-right: 3%;
        }
        .block_radio {
            display: block !important;
        }
        .label_req {
            float: left;
        }
        .textbox_err_msg {
            color: red;
            margin-left: 5px;
        }
        .requiredcls {
            display: none;
            float: left;
            color: red;
        }
        .manditory_fields {
            color: red;
        }
        .bottom_note {
            border: 1px solid #ccc;
            padding: 5px;
            margin-top: 10px;
        }
        .smalltitle {
            font-size: 22px;
        }
        .midtitle  {
            font-size: 24px;
        }
        .largetitle {
            font-size: 26px;
        }
        .temp_title {
            margin: 0 !important;
            padding-top: 40px;
        }
        .form_table {
            border: 1px solid #ccc;
            border-collapse: collapse;
            width: auto;
            padding: 0 !important;
        }
        .tbl_td {
            border:none !important;
            box-shadow: none !important;
            transition:0 !important;
            margin-bottom: 0 !important;
            padding:4px 6px;
            height: 20px;
            min-height: 20px !important;
            width: 120px;
        }
        .table_div {
            overflow-x: auto;
            overflow-y: auto;
        }
        .tbl_btn {
            display: none;
            margin-top: 10px 
        }
        .required_msg {
            color: red;
        }
        .template_txtarea {
            width: 100% !important;
        }
        input[type="radio"],input[type="checkbox"] {
            margin: 0px !important;
        }
        .template_txtarea
        {
            width: 100% !important;
        }
    
</style>
<form name="doc_template" id="doc_template" class="doc_template" style="width:800px; margin:10px auto;"><legend><p class="  temp_title">test</p></legend><p>testing </p>
                    
                    <!-- Action bar - Suited for buttons on form -->
                    <div class="row row-fluid" style="z-index: 95;">
                        <div class="col-md-6 span6 droppedFields" style="z-index: 96;"><div class="droppedField row row-fluid" style="z-index: 39;" id="CTRL-DIV-1001">
			<div class="col-md-3 span3" style="z-index: 41;">
                            <div class="row" style="z-index: 43;"><label class="control-label label_req">Custom Combobox</label><label class="label_req requiredcls">*</label></div>
                        </div>
			<div class="col-md-9 span9" style="z-index: 45;">
                            <select class="ctrl-combobox cntrol_comp">
                                <option value="option1">Option 1</option>
                                <option value="option2">Option 2</option>
                                <option value="option3">Option 3</option>
                            </select>
                            <p class="required_msg"></p>    
                            <input type="hidden" class="hiddenObligatoire">
			</div>
                    </div></div>
			<div class="col-md-6 span6 droppedFields" style="z-index: 97;"></div>
                    </div><div class="row row-fluid" style="z-index: 98;">
			<div class="col-md-12 span12 action-bar droppedFields" style="min-height: 80px; z-index: 99;"><div class="droppedField row row-fluid" style="z-index: 58;" id="CTRL-DIV-1002">
			<div class="col-md-3 span3" style="z-index: 60;">
                            <div class="row" style="z-index: 62;"><label class="label_req control-label" style="vertical-align:top">Custom Listbox</label><label class="label_req requiredcls">*</label></div>
                        </div>
			<div style="display: inline-block; z-index: 64;" class="col-md-9 span9">
                            <select multiple="multiple" style="width:150px" class="ctrl-selectmultiplelist cntrol_comp" name="Custom_Listbox"><option>Option 1</option><option>Option 2</option><option>Option 3</option></select>
                            <p class="required_msg"></p>    
			</div>
			<input type="hidden" class="hiddenObligatoire" value="false">
                    </div></div>
                    </div>
                    <div class="row form_btn"><input type="reset" class="btn" value="Reset"></div><div class="row bottom_note"><p><b>Note:</b></p><p>The fields with <span class="manditory_fields"> * </span>are required/manditory fields.</p></div>
</form></body></html>
